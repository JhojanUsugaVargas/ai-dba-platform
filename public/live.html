<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Designer Live Feed</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --text:#16181d; --muted:#5d6573; --border:#dde1e7; --accent:#2f5bd3; --ok:#1d7f4e; --run:#9a6400; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111317; --panel:#1a1d23; --text:#e7e9ee; --muted:#9aa2b1; --border:#2e333d; --accent:#7ea2ff; --ok:#5cc98f; --run:#e3b04b; } }
    :root[data-theme="dark"] { --bg:#111317; --panel:#1a1d23; --text:#e7e9ee; --muted:#9aa2b1; --border:#2e333d; --accent:#7ea2ff; --ok:#5cc98f; --run:#e3b04b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
    header { padding:14px 16px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; }
    h1 { font-size:17px; margin:0; } .muted { color:var(--muted); font-size:12px; }
    main { max-width:1000px; margin:0 auto; padding:16px; }
    .step { background:var(--panel); border:1px solid var(--border); border-left:4px solid var(--ok); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
    .step.running { border-left-color:var(--run); }
    .step h2 { font-size:14px; margin:0 0 4px; } .step p { margin:4px 0; white-space:pre-wrap; }
    .step img { max-width:100%; border:1px solid var(--border); border-radius:8px; margin-top:8px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
    .running .dot { background:var(--run); animation:p 1s infinite; } @keyframes p { 50% { opacity:.3; } }
  </style>
</head>
<body>
  <header><h1>Agente diseñador · feed en vivo</h1><div class="muted" id="meta">Esperando pasos…</div></header>
  <main id="feed"></main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    let last = '';
    async function tick() {
      try {
        const r = await fetch('/live/progress.json?t=' + Date.now(), { cache: 'no-store' });
        const text = await r.text();
        if (text !== last) {
          last = text;
          const steps = JSON.parse(text);
          document.getElementById('meta').textContent = `${steps.length} pasos · actualizado ${new Date().toLocaleTimeString()} · se refresca cada 2 s`;
          document.getElementById('feed').innerHTML = steps.slice().reverse().map((s) => `
            <div class="step ${s.status === 'running' ? 'running' : ''}">
              <h2><span class="dot"></span>${esc(s.title)}</h2>
              <div class="muted">${esc(new Date(s.ts).toLocaleTimeString())} · ${esc(s.status)}</div>
              ${s.detail ? `<p>${esc(s.detail)}</p>` : ''}
              ${s.shot ? `<img src="/live/${esc(s.shot)}?t=${esc(s.ts)}" alt="${esc(s.title)}">` : ''}
            </div>`).join('');
        }
      } catch {}
    }
    tick(); setInterval(tick, 2000);
  </script>
</body>
</html>
